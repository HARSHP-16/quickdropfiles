<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open a QuickDrop code</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="shell"><nav class="nav"><a class="brand" href="/">QUICK<span>DROP</span></a></nav><main><section class="panel share-card center"><div class="eyebrow">Have a code?</div><h1>Open a share</h1><p class="note">Enter the 12-character code shown on the other device.</p><form id="form"><input id="code" placeholder="ABCD-EFGH-IJKL" autocomplete="off" aria-label="Share code"><p><button class="button">Open share →</button></p><p id="error" class="error"></p></form></section></main></div><script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/lookup/'+document.querySelector('#code').value.trim());let d=await r.json();if(r.ok)location.href=d.url;else document.querySelector('#error').textContent=d.error}</script></body></html>
