<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Share Unavailable – QuickDrop</title>
  <meta name="description" content="This QuickDrop share has expired and the content is no longer available.">
  <link rel="canonical" href="https://quickdropfiles.vercel.app/expired">
  <!-- Status/tombstone page; do not index in search results, but follow links back to home -->
  <meta name="robots" content="noindex, follow">

  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="shell">
    <nav class="nav">
      <a class="brand" href="/">QUICK<span>DROP</span></a>
    </nav>
    <main>
      <section class="panel share-card center">
        <div class="check">!</div>
        <div class="eyebrow">Share unavailable</div>
        <h1>This share has expired.</h1>
        <p class="note">The content is no longer available and will be removed automatically.</p>
        <p><a class="button" href="/">Create a new share</a></p>
      </section>
    </main>
  </div>
</body>
</html>
